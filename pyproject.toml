[project]
name = "portfolio-dashboard"
version = "0.2.0"
description = "Local portfolio dashboard with bundled React frontend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.128.0",
    "pandas>=2.3.3",
    "portfolio-core @ git+https://github.com/T1m-V/portfolio-core.git@v0.2.0",
    "portfolio-crypto-data @ git+https://github.com/T1m-V/portfolio-crypto-data.git@v0.2.0",
    "portfolio-market-data @ git+https://github.com/T1m-V/portfolio-market-data.git@v0.2.1",
    "uvicorn>=0.40.0",
]

[project.scripts]
portfolio-dashboard = "portfolio_dashboard.cli:main"

[dependency-groups]
dev = ["httpx2>=0.1.0", "pytest>=9.0.2", "ruff>=0.14.10"]

[build-system]
requires = ["uv-build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.3,<0.13"
preview-features = ["centralized-project-envs"]

[tool.uv.sources]
portfolio-core = { path = "../portfolio-core", editable = true }
portfolio-crypto-data = { path = "../portfolio-crypto-data", editable = true }
portfolio-market-data = { path = "../portfolio-market-data", editable = true }

[tool.uv.build-backend]
source-exclude = ["node_modules"]
wheel-exclude = ["frontend"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
