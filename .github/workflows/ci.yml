name: CI

on:
  push:
  pull_request:

jobs:
  test-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portfolio-dashboard
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: portfolio-dashboard
      - name: Checkout editable core dependency
        uses: actions/checkout@v4
        with:
          repository: T1m-V/portfolio-core
          path: portfolio-core
      - name: Checkout editable market dependency
        uses: actions/checkout@v4
        with:
          repository: T1m-V/portfolio-market-data
          path: portfolio-market-data
      - name: Checkout editable crypto dependency
        uses: actions/checkout@v4
        with:
          repository: T1m-V/portfolio-crypto-data
          path: portfolio-crypto-data
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run python -m pytest
      - name: Build frontend
        working-directory: portfolio-dashboard/src/portfolio_dashboard/frontend
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build
      - run: uv build
      - name: Install wheel without sibling checkouts
        run: |
          uv venv .ci-venv --python 3.14
          uv pip install --no-sources --python .ci-venv/bin/python dist/*.whl
          .ci-venv/bin/portfolio-dashboard --help
          .ci-venv/bin/python -c "from importlib.resources import files; from portfolio_dashboard.main import create_app; from portfolio_core import PortfolioContext; assert files('portfolio_dashboard').joinpath('static/index.html').is_file(); create_app(context=PortfolioContext.from_root('.'))"
